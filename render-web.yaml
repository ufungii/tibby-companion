# Optional standalone browser demo. Existing backend is deployed separately.
# Use this file for New > Blueprint; do not recreate the backend's Blueprint.
services:
  - type: web
    name: tibby-companion-web
    runtime: static
    rootDir: tibby_app
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://tibby-backend-9le6.onrender.com
      - key: EXPO_PUBLIC_DEMO_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
